name: YouTube upload Coimbra 031

on:
  workflow_call:
    outputs:
      youtube_url:
        description: Uploaded YouTube URL
        value: ${{ jobs.upload.outputs.youtube_url }}

permissions:
  actions: read
  contents: read

jobs:
  upload:
    if: github.repository == 'Dmitry-dev-pet/mac-access'
    runs-on: ubuntu-latest
    environment: youtube-audit
    timeout-minutes: 20
    outputs:
      youtube_url: ${{ steps.result.outputs.youtube_url }}

    steps:
      - name: Check out fixed uploader repository
        uses: actions/checkout@v4
        with:
          repository: Dmitry-dev-pet/feynman-reader
          ref: main
          path: feynman-reader

      - name: Download verified Coimbra 031 artifact
        uses: actions/download-artifact@v4
        with:
          repository: Dmitry-dev-pet/mac-access
          run-id: 36848060020
          name: coimbra-031-production-look-metal-full-route
          github-token: ${{ github.token }}
          path: coimbra-031

      - name: Verify exact accepted video
        shell: bash
        run: |
          set -euo pipefail
          video="coimbra-031/coimbra-production-look-metal-12s.mp4"
          test -s "$video"
          test "$(sha256sum "$video" | awk '{print $1}')" = "07eed570d106d011f4c8f98086982d9a0be5e86aa31b1e5ac3e4e061e79e6e80"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YouTube API dependencies
        run: python -m pip install -r feynman-reader/tools/youtube-upload-requirements.txt

      - name: Restore YouTube OAuth token
        env:
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$YOUTUBE_TOKEN_B64"
          umask 077
          secrets_dir="$RUNNER_TEMP/feynman-youtube"
          mkdir -p "$secrets_dir"
          printf '%s' "$YOUTUBE_TOKEN_B64" | base64 --decode > "$secrets_dir/youtube-token.json"

      - name: Prepare video description
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/coimbra-031-description.txt" <<'EOF'
          Coimbra 031 — production-look Metal full route.

          Verified delivery:
          • 360 frames
          • 1600×1000
          • 30 fps
          • 12 seconds
          • Blender Cycles / Apple Metal
          • Render source commit: f950651ab0d891dfed871d7b799d1691c173fa69
          • Video SHA-256: 07eed570d106d011f4c8f98086982d9a0be5e86aa31b1e5ac3e4e061e79e6e80

          Project:
          https://github.com/Dmitry-dev-pet/coimbra-video

          Terrain / Ortho © DGT · Open data / CC BY 4.0
          Map data © OpenStreetMap contributors · ODbL
          EOF

      - name: Upload verified Coimbra 031 video as unlisted
        shell: bash
        run: |
          set -euo pipefail
          python feynman-reader/tools/youtube_upload.py upload             coimbra-031/coimbra-production-look-metal-12s.mp4             --title "Coimbra 031 — Production Look Metal Flyover"             --privacy unlisted             --category 19             --description-file "$RUNNER_TEMP/coimbra-031-description.txt"             --tags Coimbra Portugal Blender Cycles Metal flyover             --token-file "$RUNNER_TEMP/feynman-youtube/youtube-token.json"             --manifest "$RUNNER_TEMP/youtube-upload-manifest.jsonl"

      - name: Publish YouTube result
        id: result
        shell: bash
        run: |
          set -euo pipefail
          youtube_url="$(
            python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "youtube-upload-manifest.jsonl"
          records = [json.loads(line) for line in path.read_text().splitlines() if line.strip()]
          if len(records) != 1 or not records[0].get("youtube_url"):
              raise SystemExit("Expected exactly one uploaded YouTube record")
          print(records[0]["youtube_url"])
          PY
          )"
          echo "youtube_url=$youtube_url" >> "$GITHUB_OUTPUT"
          echo "Uploaded: $youtube_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary OAuth files
        if: ${{ always() }}
        shell: bash
        run: rm -rf "$RUNNER_TEMP/feynman-youtube"
