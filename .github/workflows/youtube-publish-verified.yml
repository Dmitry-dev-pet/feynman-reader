name: Publish verified video

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  gate:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[youtube] ')
    runs-on: ubuntu-latest
    outputs:
      contract: ${{ steps.route.outputs.contract }}
    steps:
      - name: Route fixed publication command
        id: route
        shell: bash
        env:
          TITLE: ${{ github.event.issue.title }}
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          case "$TITLE" in
            "[youtube] coimbra-032")
              echo "contract=youtube-publication-contracts/coimbra-032.json" >> "$GITHUB_OUTPUT"
              ;;
            "[youtube] coimbra-036-preview")
              echo "contract=youtube-publication-contracts/coimbra-036-preview.json" >> "$GITHUB_OUTPUT"
              ;;
            *)
              gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY"                 --body "Unsupported YouTube publication command."
              exit 2
              ;;
          esac

  publish:
    needs: gate
    runs-on: ubuntu-latest
    environment: youtube-audit
    timeout-minutes: 25
    outputs:
      youtube_url: ${{ steps.result.outputs.youtube_url }}
      video_sha256: ${{ steps.result.outputs.video_sha256 }}
      publish_status: ${{ steps.result.outputs.publish_status }}
    steps:
      - name: Check out publisher
        uses: actions/checkout@v4

      - name: Read fixed publication contract
        id: contract
        shell: bash
        env:
          CONTRACT: ${{ needs.gate.outputs.contract }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          path = Path(os.environ["CONTRACT"])
          data = json.loads(path.read_text())
          source = data["source"]
          values = {
              "repository": source["repository"],
              "run_id": str(source["run_id"]),
              "artifact_name": source["artifact_name"],
              "video_sha256": source["video_sha256"],
          }
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a") as fh:
              for key, value in values.items():
                  if "\n" in value or "\r" in value:
                      raise SystemExit(f"invalid newline in {key}")
                  fh.write(f"{key}={value}\n")
          PY

      - name: Validate Artifact Reader identifier
        shell: bash
        env:
          CLIENT_ID: ${{ vars.ARTIFACT_READER_APP_CLIENT_ID }}
          APP_ID: ${{ vars.ARTIFACT_READER_APP_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CLIENT_ID" && -z "$APP_ID" ]]; then
            echo "::error::Artifact Reader App identifier is not configured"
            exit 2
          fi

      - name: Mint read-only mac-access artifact token with client ID
        id: artifact-token-client
        if: ${{ vars.ARTIFACT_READER_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.ARTIFACT_READER_APP_CLIENT_ID }}
          private-key: ${{ secrets.ARTIFACT_READER_APP_PRIVATE_KEY }}
          owner: Dmitry-dev-pet
          repositories: mac-access
          permission-actions: read

      - name: Mint read-only mac-access artifact token with App ID
        id: artifact-token-app
        if: ${{ vars.ARTIFACT_READER_APP_CLIENT_ID == '' && vars.ARTIFACT_READER_APP_ID != '' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.ARTIFACT_READER_APP_ID }}
          private-key: ${{ secrets.ARTIFACT_READER_APP_PRIVATE_KEY }}
          owner: Dmitry-dev-pet
          repositories: mac-access
          permission-actions: read

      - name: Download pinned verified artifact
        uses: actions/download-artifact@v4
        with:
          repository: ${{ steps.contract.outputs.repository }}
          run-id: ${{ steps.contract.outputs.run_id }}
          name: ${{ steps.contract.outputs.artifact_name }}
          github-token: ${{ steps.artifact-token-client.outputs.token || steps.artifact-token-app.outputs.token }}
          path: verified-artifact

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YouTube dependencies
        run: python -m pip install -r tools/youtube-upload-requirements.txt

      - name: Restore YouTube OAuth token
        env:
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$YOUTUBE_TOKEN_B64"
          umask 077
          mkdir -p "$RUNNER_TEMP/feynman-youtube"
          printf '%s' "$YOUTUBE_TOKEN_B64" | base64 --decode             > "$RUNNER_TEMP/feynman-youtube/youtube-token.json"

      - name: Verify artifact and publish idempotently
        shell: bash
        env:
          CONTRACT: ${{ needs.gate.outputs.contract }}
        run: |
          set -euo pipefail
          python tools/publish_verified_video.py             --contract "$CONTRACT"             --artifact-root verified-artifact             --token-file "$RUNNER_TEMP/feynman-youtube/youtube-token.json"             --result "$RUNNER_TEMP/youtube-publication-result.json"

      - name: Prepare sanitized result
        id: result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          result = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "youtube-publication-result.json").read_text()
          )
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a") as fh:
              fh.write(f"youtube_url={result['youtube_url']}\n")
              fh.write(f"video_sha256={result['video_sha256']}\n")
              fh.write(f"publish_status={result['status']}\n")
          PY

      - name: Upload sanitized publication receipt
        uses: actions/upload-artifact@v4
        with:
          name: coimbra-032-youtube-publication
          path: ${{ runner.temp }}/youtube-publication-result.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary OAuth files
        if: ${{ always() }}
        shell: bash
        run: rm -rf "$RUNNER_TEMP/feynman-youtube"

  report:
    needs: [gate, publish]
    if: always() && needs.gate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Report publication outcome
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          YOUTUBE_URL: ${{ needs.publish.outputs.youtube_url }}
          VIDEO_SHA256: ${{ needs.publish.outputs.video_sha256 }}
          PUBLISH_STATUS: ${{ needs.publish.outputs.publish_status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_RESULT" == "success" && -n "$YOUTUBE_URL" ]]; then
            printf -v body 'Verified video publication **%s**: %s\n\n- video SHA-256: `%s`\n- publication run: %s' \
              "$PUBLISH_STATUS" "$YOUTUBE_URL" "$VIDEO_SHA256" "$RUN_URL"
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$body"
            gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --reason completed
          else
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" \
              --body "Verified video publication failed. Inspect: $RUN_URL"
            exit 1
          fi
