name: YouTube channel audit

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Read-only YouTube check to run"
        required: true
        default: audit
        type: choice
        options:
          - audit
          - dry-run

permissions:
  contents: read

concurrency:
  group: youtube-channel-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: youtube-audit
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YouTube API dependencies
        run: python -m pip install -r tools/youtube-upload-requirements.txt

      - name: Restore YouTube OAuth token
        env:
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$YOUTUBE_TOKEN_B64"

          umask 077
          secrets_dir="$RUNNER_TEMP/feynman-youtube"
          mkdir -p "$secrets_dir"

          printf '%s' "$YOUTUBE_TOKEN_B64" | base64 --decode > "$secrets_dir/youtube-token.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "feynman-youtube" / "youtube-token.json"
          with path.open("r", encoding="utf-8") as fh:
              token = json.load(fh)

          required_fields = {"refresh_token", "token_uri", "client_id", "client_secret"}
          missing_fields = sorted(field for field in required_fields if not token.get(field))
          if missing_fields:
              raise SystemExit(f"youtube-token.json is missing required fields: {missing_fields}")

          required_scopes = {
              "https://www.googleapis.com/auth/youtube.upload",
              "https://www.googleapis.com/auth/youtube.force-ssl",
          }
          scopes = set(token.get("scopes") or [])
          missing_scopes = sorted(required_scopes - scopes)
          if missing_scopes:
              raise SystemExit(f"youtube-token.json is missing required scopes: {missing_scopes}")

          print("validated youtube-token.json")
          PY

      - name: Audit current YouTube visibility and metadata
        if: ${{ inputs.mode == 'audit' }}
        run: |
          python tools/sync_youtube_channel.py \
            --token-file "$RUNNER_TEMP/feynman-youtube/youtube-token.json" \
            --video-report-only

      - name: Preview full synchronization
        if: ${{ inputs.mode == 'dry-run' }}
        run: |
          python tools/sync_youtube_channel.py \
            --token-file "$RUNNER_TEMP/feynman-youtube/youtube-token.json" \
            --dry-run

      - name: Remove temporary OAuth files
        if: ${{ always() }}
        shell: bash
        run: rm -rf "$RUNNER_TEMP/feynman-youtube"
